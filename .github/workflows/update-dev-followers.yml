name: Update DEV Followers

on:
  # Run automatically once per day at 12:00 UTC
  schedule:
    - cron: "0 12 * * *"

  # Also lets you run it manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dev-followers:
    name: Update DEV follower badge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch DEV followers and generate badge
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: node update.js

      - name: Commit updated follower count
        run: |
          if git diff --quiet; then
            echo "No follower changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md assets/dev-followers.svg

          git commit -m "chore: update DEV follower count"
          git push
